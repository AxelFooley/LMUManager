name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Test before release
        run: dotnet test LMUManager.Tests -c Release

      - name: Publish single-file exe
        run: >
          dotnet publish LMUManager.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None -p:DebugSymbols=false

      - name: Package
        run: |
          Compress-Archive -Path "bin/Release/net8.0-windows/win-x64/publish/LMUManager.exe" `
            -DestinationPath "LMUManager-${{ github.ref_name }}-win-x64.zip"

      - name: Extract changelog section
        id: changelog
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $content = Get-Content CHANGELOG.md -Raw
          $match = [regex]::Match($content, "(?s)## \[$($tag.TrimStart('v'))\][^\r\n]*(.*?)(?=\r?\n## |\z)")
          if ($match.Success) {
            $section = $match.Groups[1].Value.Trim()
            Write-Output "source: CHANGELOG.md"
          } else {
            Write-Output "source: commit log (no CHANGELOG section for $tag)"
            $prev = git describe --tags --abbrev=0 "$tag^" 2>$null
            if ($prev) {
              $log = git log --pretty="format:- %s" "$prev..$tag" | Out-String
              $section = "### Changes since $prev`n`n" + $log.Trim()
            } else {
              $section = "First release - see the project README."
            }
          }
          "body<<EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $section | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          body: ${{ steps.changelog.outputs.body }}
          files: LMUManager-${{ github.ref_name }}-win-x64.zip
